<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>N1ceOS</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>

<style>
:root{--bg:#15161c;--sf:rgba(32,34,44,.82);--sf2:#262833;--tx:#e8e9f0;--mu:#8b8fa3;--bd:rgba(255,255,255,.09);--ac:#6c8cff}
:root[data-l="1"]{--bg:#e9ebf2;--sf:rgba(255,255,255,.85);--sf2:#f1f2f7;--tx:#1b1d27;--mu:#666b80;--bd:rgba(0,0,0,.1)}

.gl{background:var(--sf);backdrop-filter:blur(18px);border:1px solid var(--bd)}
.win{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:scale(.94)}}
.btn{padding:4px 10px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd)}.btn:hover{background:var(--ac);color:#fff}
.it:hover{background:rgba(127,127,160,.2)}input,textarea{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;outline:none;user-select:text}

</style></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback}=React;
const I=({n,s=18,c=''})=>{let d=lucide.icons[n]||lucide.icons.Circle;if(d[0]==="svg")d=d[2]||[];return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={c}>{d.map(([t,a],i)=>React.createElement(t,{...a,key:i}))}</svg>};
let UKV=null; // per-user data cache (Electron: loaded from main process after login, persisted via IPC)
const ld=(k,d)=>{try{if(UKV)return UKV[k]??d;return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const sv=(k,v)=>{try{if(UKV){UKV[k]=v;window.n1ce.kv.set(k,v);return}localStorage.setItem(k,JSON.stringify(v))}catch{}};
const WALLS=[["Nebula","linear-gradient(135deg,#1a1b3a,#3b2a6b 50%,#12304f)"],["Aurora","linear-gradient(160deg,#0b1d2a,#14504a 55%,#2a2a6a)"],["Dusk","linear-gradient(135deg,#2a1530,#5a2a55 50%,#1c2a55)"],["Graphite","linear-gradient(135deg,#17181d,#2c2e38)"]];
const ACC=["#6c8cff","#a07bff","#3ecfb2","#ff7ba8","#ffb454"];
const DEF_FS={desktop:{n:"Desktop",t:"d",p:"home"},docs:{n:"Documents",t:"d",p:"home"},dl:{n:"Downloads",t:"d",p:"home"},pics:{n:"Pictures",t:"d",p:"home"},r1:{n:"readme.txt",t:"f",p:"docs",c:"Welcome to N1ceOS 1.0 by Cr1sN1ce.\nEverything here lives in your browser's localStorage."}};
const APPS0={files:["Files","FolderOpen"],term:["Terminal","SquareTerminal"],browser:["N1ce Browser","Globe"],settings:["Settings","Settings"],edit:["Text Editor","FileText"],calc:["Calculator","Calculator"],mon:["System Monitor","Activity"],store:["App Store","ShoppingBag"],chess:["N1ce Chess","Crown"],hockey:["N1ce Air Hockey","Target"],notes:["Notes+","NotebookPen"],paint:["Paint","Palette"],weather:["Weather","CloudSun"],music:["Music","Music"],clock:["Clock","Clock"],viewer:["Image Viewer","Image"],trash:["Trash","Trash2"]};
const PKI={};const APPS=new Proxy(APPS0,{get:(t,k)=>t[k]||(typeof k==="string"?PKI[k]:undefined)});
const STORE=[["Notes+","Productivity","NotebookPen","notes","Notes that save automatically."],["Paint","Graphics","Palette","paint","Draw, erase, save and open images."],["Chess","Games","Crown",null,"",1],["Weather","Utilities","CloudSun","weather","Live weather for any city."],["Music","Media","Music","music","Spotify player."],["Clock","Utilities","Clock","clock","Clock, stopwatch, timer and alarms."],["N1ce Chess","Games","Crown","chess","Full chess rules, computer opponent, clocks and analysis."],["N1ce Air Hockey","Games","Target","hockey","Arcade air hockey vs computer or a friend."],["N1ce Browser","Internet","Globe","browser","Tabbed browser with bookmarks, history, downloads and settings."]];
let uid=Date.now();const nid=()=>"f"+(uid++).toString(36);

function App({user,logout}){
 const [booted,setBooted]=useState(false);const [me,setMe]=useState(user);
 const [S,setS]=useState(()=>({acc:ACC[0],light:0,wall:0,dock:"bottom",hide:0,wifi:1,bt:1,dnd:0,vol:60,br:100,inst:[],...ld("n1_s",{})}));
 const [fs,setFs]=useState(()=>ld("n1_fs",DEF_FS));
 const [wins,setWins]=useState([]);const [z,setZ]=useState(10);
 const [menu,setMenu]=useState(null);const [panel,setPanel]=useState(null);
 const [notes,setNotes]=useState([{t:"Welcome to N1ceOS",b:"Double-click icons or use the Dock."}]);
 const [toast,setToast]=useState(null);const [now,setNow]=useState(new Date());
 const t0=useRef(Date.now());
 (S.pk||[]).forEach(p=>{PKI["pkg:"+p.id]=[p.name,p.icon]});
 useEffect(()=>{sv("n1_s",S);document.documentElement.dataset.l=S.light;document.documentElement.style.setProperty("--ac",S.acc)},[S]);
 useEffect(()=>sv("n1_fs",fs),[fs]);
 useEffect(()=>{const i=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(i)},[]);
 useEffect(()=>{const t=setTimeout(()=>setBooted(true),2400);return()=>clearTimeout(t)},[booted]);
 useEffect(()=>{const h=ev=>{const {e,items}=ev.detail;setMenu({x:Math.min(e.clientX,innerWidth-190),y:Math.min(e.clientY,innerHeight-items.length*34-10),items})};addEventListener("n1ctx",h);return()=>removeEventListener("n1ctx",h)},[]);
 const up=(k,v)=>setS(s=>({...s,[k]:v}));
 const notify=(t,b="")=>{setNotes(n=>[{t,b},...n].slice(0,20));if(!S.dnd){setToast({t,b});setTimeout(()=>setToast(null),2500)}};
 const F={fs,
  mk:(n,t,p,c="")=>{const id=nid();setFs(f=>({...f,[id]:{n,t,p,c}}));return id},
  ren:(id,n)=>setFs(f=>({...f,[id]:{...f[id],n}})),
  set:(id,c)=>setFs(f=>({...f,[id]:{...f[id],c}})),
  mkb:(n,p,b,size)=>{const id=nid();setFs(f=>({...f,[id]:{n,t:"f",p,c:"",b,size}}));return id},
  del:id=>setFs(f=>({...f,[id]:{...f[id],del:1}})),
  res:id=>setFs(f=>({...f,[id]:{...f[id],del:0}})),
  purge:id=>setFs(f=>{const g={...f};const rm=x=>{if(g[x]&&g[x].b&&isEl)window.n1ce.file.remove(g[x].b);delete g[x];Object.keys(g).filter(k=>g[k].p===x).forEach(rm)};rm(id);return g}),
  mv:(id,p)=>setFs(f=>({...f,[id]:{...f[id],p}}))};
 const open=(app,arg)=>{
  if(app==="trash"){app="files";arg="trash"}
  setWins(w=>{const ex=w.find(x=>x.app===app&&app!=="edit"&&app!=="files"&&arg!=="new");const nz=z+1;setZ(nz);
   if(ex)return w.map(x=>x===ex?{...x,min:0,z:nz}:x);
   const k=w.length%6;return [...w,{id:nid(),app,arg,z:nz,min:0,max:0,x:120+k*34,y:60+k*30,w:app==="calc"?300:app==="mon"?520:app==="chess"?800:app==="hockey"?620:app==="browser"?900:720,h:app==="calc"?420:app==="chess"?580:app==="hockey"?640:app==="browser"?580:470}]})};
 const foc=id=>{const cw=wins.find(x=>x.id===id);if(cw&&!cw.min&&cw.z===z)return;const nz=z+1;setZ(nz);setWins(w=>w.map(x=>x.id===id?{...x,z:nz,min:0}:x))};
 useEffect(()=>{const fired=new Set();const i=setInterval(()=>{const d=new Date(),hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");ld("n1_alarms",[]).forEach(a=>{const k=a.id+d.toDateString()+hm;if(a.on&&a.t===hm&&!fired.has(k)){fired.add(k);notify("Alarm",a.l||hm);[0,600,1200].forEach(t=>setTimeout(()=>snd({mute:0},880,.4),t))}})},5000);return()=>clearInterval(i)},[]);
 useEffect(()=>{if(!isEl)return;const seen=new Set();return window.n1ce.onDownload(d=>{if(d.st==="Completed"&&d.stored&&!seen.has(d.id)){seen.add(d.id);F.mkb(d.stored,"dl",d.stored,d.size);notify("Download complete",d.stored+" saved to Downloads")}else if(d.st&&/^(Failed|Cancelled|Too large)/.test(d.st))notify("Download "+d.st.toLowerCase(),d.name||"")})},[]);
 useEffect(()=>{const h=e=>foc(e.detail);addEventListener("n1focus",h);return()=>removeEventListener("n1focus",h)});
 const upd=(id,p)=>setWins(w=>w.map(x=>x.id===id?{...x,...p}:x));
 const close=id=>setWins(w=>w.filter(x=>x.id!==id));
 const top=wins.filter(w=>!w.min).sort((a,b)=>b.z-a.z)[0];
 const ctx=(e,items)=>{e.preventDefault();e.stopPropagation();setMenu({x:Math.min(e.clientX,innerWidth-190),y:Math.min(e.clientY,innerHeight-items.length*34-10),items})};
 const reset=()=>{if(confirm("Reset N1ceOS? All files and settings will be erased.")){if(UKV){window.n1ce.kv.clear().then(()=>location.reload());return}localStorage.removeItem("n1_s");localStorage.removeItem("n1_fs");location.reload()}};
 const ctxv={S,up,F,open,notify,wins,reset,t0,setBooted,user:me,setMe,logout};
 if(!booted)return <Boot/>;
 const dk=S.dock,vert=dk!=="bottom";
 const desk=Object.entries(fs).filter(([,f])=>f.p==="desktop"&&!f.del);
 return <C.Provider value={ctxv}><div className="h-full w-full relative overflow-hidden" style={{background:S.wall===-1&&S.cw?`url(${S.cw}) center/cover no-repeat`:WALLS[Math.max(0,S.wall)][1],filter:`brightness(${.4+S.br/166})`}} onMouseDown={()=>{setMenu(null);setPanel(null)}} onContextMenu={e=>ctx(e,[["New Folder","FolderPlus",()=>F.mk("New Folder","d","desktop")],["New Text File","FilePlus",()=>F.mk("untitled.txt","f","desktop")],["Change Wallpaper","Image",()=>{up("wall",(S.wall+1)%WALLS.length)}],["Settings","Settings",()=>open("settings")]])}>
  <div className="absolute inset-0 pt-10 p-4 flex flex-col flex-wrap content-start gap-2" style={{paddingLeft:dk==="left"?90:16,paddingRight:dk==="right"?90:16}}>
   {desk.map(([id,f])=><div key={id} className="w-20 p-2 rounded-lg it text-center cursor-default" onDoubleClick={()=>open(f.t==="d"?"files":(f.c||"").startsWith("data:image/")?"viewer":"edit",id)} onContextMenu={e=>ctx(e,[["Open","ExternalLink",()=>open(f.t==="d"?"files":(f.c||"").startsWith("data:image/")?"viewer":"edit",id)],["Rename","Pencil",()=>{const n=prompt("Name",f.n);n&&F.ren(id,n)}],["Move to Trash","Trash2",()=>F.del(id)]])}>
    <I n={f.t==="d"?"Folder":"FileText"} s={38} c="mx-auto" /><div className="text-xs mt-1 truncate text-white drop-shadow">{f.n}</div></div>)}
  </div>
  {wins.map(w=><Win key={w.id} w={w} focused={top===w} {...{foc,upd,close,vert}}/>)}
  <TopPanel {...{now,top,panel,setPanel,ctx,notes}}/>
  <Dock {...{ctx,top,wins,foc,upd,close}}/>
  {panel==="notif"&&<div className="gl absolute right-3 top-10 w-72 rounded-xl p-3 z-[9999]" onMouseDown={e=>e.stopPropagation()}><div className="flex justify-between mb-2 font-medium">Notifications<button className="text-xs" style={{color:"var(--ac)"}} onClick={()=>setNotes([])}>Clear</button></div>{notes.length?notes.map((n,i)=><div key={i} className="p-2 mb-1 rounded-lg" style={{background:"var(--sf2)"}}><div className="text-sm">{n.t}</div><div className="text-xs" style={{color:"var(--mu)"}}>{n.b}</div></div>):<div className="text-sm py-6 text-center" style={{color:"var(--mu)"}}>No notifications</div>}</div>}
  {panel==="qs"&&<div className="gl absolute right-3 top-10 w-72 rounded-xl p-3 z-[9999]" onMouseDown={e=>e.stopPropagation()}>
   <div className="grid grid-cols-2 gap-2 mb-3">{[["wifi","Wi-Fi","Wifi"],["bt","Bluetooth","Bluetooth"],["light","Light mode","Sun"],["dnd","Do Not Disturb","BellOff"]].map(([k,l,ic])=><button key={k} onClick={()=>up(k,S[k]?0:1)} className="flex items-center gap-2 p-2 rounded-lg text-sm" style={{background:S[k]?"var(--ac)":"var(--sf2)",color:S[k]?"#fff":"var(--tx)"}}><I n={ic}/>{l}</button>)}</div>
   {[["vol","Volume","Volume2"],["br","Brightness","SunMedium"]].map(([k,l,ic])=><div key={k} className="flex items-center gap-2 mb-2"><I n={ic}/><input type="range" min="10" max="100" value={S[k]} onChange={e=>up(k,+e.target.value)} className="flex-1" style={{accentColor:S.acc,padding:0}}/><span className="text-xs w-7">{S[k]}</span></div>)}
   <div className="flex gap-2 mt-2"><button className="btn flex-1" onClick={()=>open("settings")}>Settings</button><button className="btn flex-1" onClick={()=>{setWins([]);setBooted(false)}}>Restart</button></div></div>}
  {menu&&<div className="gl fixed rounded-xl p-1 z-[10000] w-44" style={{left:menu.x,top:menu.y}} onMouseDown={e=>e.stopPropagation()}>{menu.items.map(([l,ic,fn])=><button key={l} className="it w-full flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm text-left" onClick={()=>{setMenu(null);fn()}}><I n={ic} s={15}/>{l}</button>)}</div>}
  {toast&&<div className="gl absolute right-3 top-12 rounded-xl px-4 py-2 z-[9998] win"><div className="text-sm font-medium">{toast.t}</div><div className="text-xs" style={{color:"var(--mu)"}}>{toast.b}</div></div>}
 </div></C.Provider>}
const C=React.createContext();
const useC=()=>React.useContext(C);

function Boot(){return <div className="h-full flex flex-col items-center justify-center" style={{background:"#0d0e13",color:"#e8e9f0"}}>
 <div className="w-20 h-20 rounded-3xl flex items-center justify-center win" style={{background:"linear-gradient(135deg,#6c8cff,#a07bff)",boxShadow:"0 0 60px #6c8cff66"}}><span className="text-3xl font-bold">N1</span></div>
 <div className="mt-5 text-xl font-semibold tracking-wide">N1ceOS</div><div className="mt-1 text-sm opacity-60">Starting N1ceOS...</div>
 <div className="mt-6 w-48 h-1 rounded bg-white/10 overflow-hidden"><div className="h-full rounded" style={{background:"#6c8cff",animation:"bar 2.2s ease-out forwards"}}/></div><style>{"@keyframes bar{from{width:0}to{width:100%}}"}</style></div>}

function TopPanel({now,top,panel,setPanel,ctx,notes}){const {S,open,wins,reset,setBooted,user,logout}=useC();
 const [m,setM]=useState(0);
 const nm=top?APPS[top.app][0]:"Desktop";
 return <div className="gl absolute top-0 inset-x-0 h-8 flex items-center justify-between px-3 text-xs z-[9990]" onMouseDown={e=>e.stopPropagation()}>
  <div className="flex items-center gap-3 relative"><button className="font-bold" style={{color:"var(--ac)"}} onClick={()=>setM(!m)}>N1</button><span className="font-semibold">{nm}</span>
   {["File","View","Help"].map(x=><button key={x} className="it px-1.5 rounded" onClick={()=>x==="File"?open("files"):x==="View"?open("mon"):open("settings")}>{x}</button>)}
   {m?<div className="gl absolute top-7 left-0 w-44 rounded-xl p-1 text-sm" onMouseLeave={()=>setM(0)}>{[["About N1ceOS","Info",()=>open("settings","about")],["Settings","Settings",()=>open("settings")],...(user?[["Log out ("+user.username+")","LogOut",logout]]:[]),["Restart","RotateCw",()=>setBooted(false)],["Reset N1ceOS","Eraser",reset]].map(([l,ic,fn])=><button key={l} className="it w-full flex gap-2 px-3 py-1.5 rounded-lg" onClick={()=>{setM(0);fn()}}><I n={ic} s={15}/>{l}</button>)}</div>:null}</div>
  <div>{now.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})}  {now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
  <div className="flex items-center gap-3"><I n={S.wifi?"Wifi":"WifiOff"} s={15}/><span className="flex items-center gap-1"><I n="BatteryMedium" s={16}/>82%</span><I n={S.vol?"Volume2":"VolumeX"} s={15}/>
   <button onClick={()=>setPanel(panel==="notif"?null:"notif")} className="relative"><I n={S.dnd?"BellOff":"Bell"} s={15}/>{notes.length>0&&<span className="absolute -top-1 -right-1 w-2 h-2 rounded-full" style={{background:"var(--ac)"}}/>}</button>
   <button onClick={()=>setPanel(panel==="qs"?null:"qs")}><I n="SlidersHorizontal" s={15}/></button></div></div>}

function Dock({ctx,top,wins,foc,upd,close}){const {S,up,open}=useC();const [mx,setMx]=useState(null);
 const v=S.dock!=="bottom";const ids=[...Object.keys(APPS).filter(k=>!["trash","chess","hockey","notes","paint","weather","music","clock","viewer"].includes(k)),...S.inst.filter(i=>STORE[i][3]!=="browser"&&!STORE[i][5]).map(i=>"x"+i),...(S.pk||[]).map(p=>"pkg:"+p.id),"trash"];
 const [hov,setHov]=useState(!S.hide);
 const info=k=>k[0]==="x"?[STORE[+k.slice(1)][0],STORE[+k.slice(1)][2]]:APPS[k];
 const pos=S.dock==="bottom"?"bottom-2 left-1/2 -translate-x-1/2 flex-row":S.dock==="left"?"left-2 top-1/2 -translate-y-1/2 flex-col":"right-2 top-1/2 -translate-y-1/2 flex-col";
 const hidden=S.hide&&!hov;
 return <><div className="absolute z-[9991]" style={{[S.dock]:0,...(v?{top:0,bottom:0,width:8}:{left:0,right:0,height:8})}} onMouseEnter={()=>setHov(1)}/>
 <div onMouseEnter={()=>setHov(1)} onMouseLeave={()=>{setMx(null);S.hide&&setHov(0)}} onMouseMove={e=>setMx(v?e.clientY:e.clientX)} onMouseDown={e=>e.stopPropagation()}
  className={`gl absolute z-[9992] flex gap-1.5 p-1.5 rounded-2xl items-end ${pos}`} style={{transition:"transform .25s",transform:hidden?(S.dock==="bottom"?"translate(-50%,120px)":S.dock==="left"?"translate(-120px,-50%)":"translate(120px,-50%)"):undefined}}>
  {ids.map(k=>{const [n,ic]=info(k);const ak=k[0]==="x"?(STORE[+k.slice(1)][3]||"browser"):k;const run=wins.some(w=>w.app===ak);
   return <button key={k} title={n} data-dk={1} className="dk relative rounded-xl flex items-center justify-center text-white shrink-0"
    ref={el=>{if(!el)return;const r=el.getBoundingClientRect();const c=v?r.top+r.height/2:r.left+r.width/2;const d=mx==null?999:Math.abs(mx-c);const sc=1+Math.max(0,1-d/110)*.55;el.style.width=el.style.height=48*sc+"px"}}
    style={{background:k==="trash"?"#4a4d5e":`linear-gradient(135deg,${S.acc},#7a5cff)`}}
    onClick={()=>open(ak)}
    onContextMenu={e=>ctx(e,[["Open","ExternalLink",()=>open(ak)],...(run?[["Close","X",()=>wins.filter(w=>w.app===ak).forEach(w=>close(w.id))]]:[]),["Dock: Left","PanelLeft",()=>up("dock","left")],["Dock: Bottom","PanelBottom",()=>up("dock","bottom")],["Dock: Right","PanelRight",()=>up("dock","right")],[S.hide?"Disable auto-hide":"Auto-hide","EyeOff",()=>up("hide",S.hide?0:1)]])}>
    <I n={ic} s={24}/>{run&&<span className="absolute w-1 h-1 rounded-full bg-white" style={v?{[S.dock==="left"?"left":"right"]:-4}:{bottom:-4}}/>}</button>})}
 </div></>}

function Win({w,focused,foc,upd,close}){
 const drag=e=>{if(w.max||e.target.closest("button"))return;foc(w.id);document.body.classList.add("n1drag");const sx=e.clientX-w.x,sy=e.clientY-w.y;
  const mv=ev=>upd(w.id,{x:ev.clientX-sx,y:Math.max(32,ev.clientY-sy)});
  const up=ev=>{document.body.classList.remove("n1drag");removeEventListener("mousemove",mv);removeEventListener("mouseup",up);if(ev.clientX<8)upd(w.id,{x:0,y:32,w:innerWidth/2,h:innerHeight-32});else if(ev.clientX>innerWidth-8)upd(w.id,{x:innerWidth/2,y:32,w:innerWidth/2,h:innerHeight-32});else if(ev.clientY<34)upd(w.id,{max:1})};
  addEventListener("mousemove",mv);addEventListener("mouseup",up)};
 const res=e=>{e.stopPropagation();e.preventDefault();foc(w.id);document.body.classList.add("n1drag");const sx=e.clientX,sy=e.clientY,sw=w.w,sh=w.h;
  const mv=ev=>upd(w.id,{w:Math.max(300,sw+ev.clientX-sx),h:Math.max(240,sh+ev.clientY-sy)});
  const up=()=>{document.body.classList.remove("n1drag");removeEventListener("mousemove",mv);removeEventListener("mouseup",up)};addEventListener("mousemove",mv);addEventListener("mouseup",up)};
 const st=w.max?{left:0,top:32,width:"100%",height:"calc(100% - 32px)"}:{left:w.x,top:w.y,width:w.w,height:w.h};
 const Cmp={files:Files,term:Term,browser:Browser,settings:SettingsApp,edit:Editor,calc:Calc,mon:Mon,store:Store,chess:ChessApp,hockey:Hockey,notes:Notes,paint:Paint,weather:Weather,music:Music,clock:ClockApp,viewer:Viewer}[w.app]||PkgApp;
 return <div className="gl win absolute rounded-xl flex flex-col overflow-hidden" onMouseDown={()=>foc(w.id)}

function Term(){const {F,S,t0,user}=useC();const un=user?user.username:"cris";const {fs}=F;const [cwd,setCwd]=useState("home");const [log,setLog]=useState([["Welcome to N1ceOS 1.0 terminal. Type 'help'."]]);const [inp,setInp]=useState("");const [hist,setHist]=useState(()=>ld("n1_thist",[]));const conf=useRef(null);const ref=useRef();const [hi,setHi]=useState(-1);

function Paint(){const {F,notify}=useC();const cv=useRef();const [col,setCol]=useState("#222222");const [sz,setSz]=useState(6);const [er,setEr]=useState(0);const last=useRef(null);

function Music(){const [list,setList]=useState(()=>ld("n1_music",[["Today's Top Hits","playlist","37i9dQZF1DXcBWIGoYBM5M"]]));const [sel,setSel]=useState(0);const [q,setQ]=useState("");const [err,setErr]=useState("");

function ClockApp(){const {notify}=useC();const [tab,setTab]=useState("clock");const [,tick]=useState(0);
 const [sw,setSw]=useState({run:0,base:0,start:0,laps:[]});const [tm,setTm]=useState({run:0,end:0,left:300000});const [tin,setTin]=useState({m:5,s:0});
 const [al,setAl]=useState(()=>ld("n1_alarms",[]));const [an,setAn]=useState({t:"07:00",l:""});
 useEffect(()=>{sv("n1_alarms",al)},[al]);
 useEffect(()=>{const i=setInterval(()=>tick(x=>x+1),100);return()=>clearInterval(i)},[]);
 const now=new Date(),swEl=sw.base+(sw.run?Date.now()-sw.start:0),tmLeft=tm.run?Math.max(0,tm.end-Date.now()):tm.left;
 useEffect(()=>{if(tm.run&&tmLeft<=0){setTm({run:0,end:0,left:(tin.m*60+tin.s)*1000});notify("Timer finished","Time is up");[0,600,1200].forEach(t=>setTimeout(()=>snd({mute:0},880,.4),t))}});

 const tabs=[["clock","Clock"],["sw","Stopwatch"],["timer","Timer"],["alarm","Alarm"]];
 return <div className="h-full flex flex-col text-sm"><div className="flex gap-1 p-2" style={{background:"var(--sf2)"}}>{tabs.map(([k,l])=><button key={k} className="btn" style={tab===k?{background:"var(--ac)",color:"#fff"}:{}} onClick={()=>setTab(k)}>{l}</button>)}</div>

  {tab==="clock"&&<><CBig>{now.toLocaleTimeString()}</CBig><div className="text-center mb-4" style={{color:"var(--mu)"}}>{now.toLocaleDateString([],{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div><div className="grid grid-cols-2 gap-2">{[["UTC","UTC"],["New York","America/New_York"],["London","Europe/London"],["Tokyo","Asia/Tokyo"]].map(([n,z])=><div key={n} className="p-3 rounded-xl flex justify-between" style={{background:"var(--sf2)"}}><span>{n}</span><span className="tabular-nums">{now.toLocaleTimeString([],{timeZone:z,hour:"2-digit",minute:"2-digit"})}</span></div>)}</div></>}
  {tab==="sw"&&<><CBig>{fmtMs(swEl)}</CBig><div className="flex gap-2 justify-center mb-3"><button className="btn" onClick={()=>setSw(s=>s.run?{...s,run:0,base:s.base+Date.now()-s.start}:{...s,run:1,start:Date.now()})}>{sw.run?"Stop":"Start"}</button><button className="btn" disabled={!sw.run} onClick={()=>setSw(s=>({...s,laps:[swEl,...s.laps]}))}>Lap</button><button className="btn" onClick={()=>setSw({run:0,base:0,start:0,laps:[]})}>Reset</button></div>{sw.laps.map((l,i)=><div key={i} className="flex justify-between py-1 border-b tabular-nums" style={{borderColor:"var(--bd)"}}><span>Lap {sw.laps.length-i}</span><span>{fmtMs(l)}</span></div>)}</>}
  {tab==="timer"&&<><CBig>{pad(Math.floor(tmLeft/3600000))}:{pad(Math.floor(tmLeft/60000)%60)}:{pad(Math.floor(tmLeft/1000)%60)}</CBig><div className="flex gap-2 justify-center items-center mb-3"><input type="number" className="w-20" value={tin.m} disabled={tm.run} onChange={e=>setT(e.target.value,tin.s)}/>min<input type="number" className="w-20" value={tin.s} disabled={tm.run} onChange={e=>setT(tin.m,e.target.value)}/>sec</div><div className="flex gap-2 justify-center"><button className="btn" disabled={!tm.run&&tm.left<=0} onClick={()=>setTm(t=>t.run?{run:0,end:0,left:tmLeft}:{run:1,end:Date.now()+t.left,left:t.left})}>{tm.run?"Pause":"Start"}</button><button className="btn" onClick={()=>setTm({run:0,end:0,left:(tin.m*60+tin.s)*1000})}>Reset</button></div></>}
  {tab==="alarm"&&<><div className="flex gap-2 mb-3"><input type="time" value={an.t} onChange={e=>setAn({...an,t:e.target.value})}/><input className="flex-1" placeholder="Label" value={an.l} onChange={e=>setAn({...an,l:e.target.value})}/><button className="btn" onClick={()=>{if(!an.t)return;setAl(a=>[...a,{id:nid(),t:an.t,l:an.l,on:1}].sort((x,y)=>x.t.localeCompare(y.t)));setAn({t:an.t,l:""})}}>Add</button></div>
   {al.length===0&&<div style={{color:"var(--mu)"}}>No alarms</div>}{al.map(a=><div key={a.id} className="flex items-center gap-3 p-2 mb-1 rounded-xl" style={{background:"var(--sf2)"}}><span className="text-2xl tabular-nums">{a.t}</span><span className="flex-1 truncate" style={{color:"var(--mu)"}}>{a.l}</span><button className="btn" style={a.on?{background:"var(--ac)",color:"#fff"}:{}} onClick={()=>setAl(x=>x.map(y=>y===a?{...a,on:a.on?0:1}:y))}>{a.on?"On":"Off"}</button><button title="Delete" onClick={()=>setAl(x=>x.filter(y=>y!==a))}><I n="Trash2" s={15}/></button></div>)}<div className="text-xs mt-2" style={{color:"var(--mu)"}}>Alarms ring while N1ceOS is running.</div></>}
  </div></div>}

const SAMPLE={n1app:1,name:"Click Counter",icon:"MousePointerClick",version:"1.0",html:"<!doctype html><body style='font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;background:#15161c;color:#e8e9f0'><div id=n style='font-size:64px'>0</div><button style='font-size:18px;padding:8px 20px;border-radius:10px;border:0;background:#6c8cff;color:#fff' onclick=\"n.textContent=+n.textContent+1\">Click me</button>"};
const pkgOk=o=>{if(!o||o.n1app!==1)return'Not an N1ceOS package (missing "n1app": 1)';if(typeof o.name!=="string"||!o.name.trim()||o.name.length>30)return"Invalid name (1-30 characters)";if(typeof o.html!=="string"||o.html.length>500000)return"Missing or too large html (max 500 KB)";return null};
function PkgManager(){const {S,up,notify,open}=useC();const [txt,setTxt]=useState("");const [err,setErr]=useState("");
 const install=raw=>{let o;try{o=JSON.parse(raw)}catch{return setErr("Not valid JSON")}const e=pkgOk(o);if(e)return setErr(e);
  const p={id:nid(),name:o.name.trim(),icon:lucide.icons[o.icon]?o.icon:"Package",version:String(o.version||"1.0").slice(0,12),html:o.html};
  up("pk",[...(S.pk||[]),p]);setTxt("");setErr("");notify("Package installed",p.name)};
 const file=e=>{const f=e.target.files[0];if(!f)return;if(f.size>600000)return setErr("File too large (max 500 KB)");f.text().then(install);e.target.value=""};
 return <div><div className="font-medium mb-1">Install an N1ce package (.json)</div><div className="text-xs mb-2" style={{color:"var(--mu)"}}>Packages are web apps that run in a sandbox: no access to your files, settings or other apps. Only install packages you trust.</div>
  <div className="flex gap-2 mb-2"><label className="btn cursor-pointer">Choose file…<input type="file" accept=".json" className="hidden" onChange={file}/></label><button className="btn" onClick={()=>install(JSON.stringify(SAMPLE))}>Install sample</button></div>
  <textarea className="w-full h-24 font-mono text-xs" placeholder="…or paste package JSON" value={txt} onChange={e=>setTxt(e.target.value)}/><button className="btn mt-1" onClick={()=>install(txt)}>Install from text</button>
  {err&&<div className="text-xs mt-1" style={{color:"#ff6b81"}}>{err}</div>}

  {(S.pk||[]).map(p=><div key={p.id} className="flex items-center gap-2 py-1"><I n={p.icon}/><span className="flex-1">{p.name} <span className="text-xs" style={{color:"var(--mu)"}}>v{p.version}</span></span><button className="btn" onClick={()=>open("pkg:"+p.id)}>Launch</button><button className="btn" onClick={()=>{up("pk",S.pk.filter(x=>x.id!==p.id));notify("Package removed",p.name)}}>Uninstall</button></div>)}</div>}
